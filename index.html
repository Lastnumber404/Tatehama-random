function getDirection(trainNo) {
  // 回、アルファベット、_以降を除去して数字だけにする
  let numStr = trainNo
    .replace(/^回/, "")
    .replace(/_[^_]*$/, "")
    .replace(/[A-Z]+$/i, "");
  let num = parseInt(numStr, 10);
  if (isNaN(num)) return "下り";
  return (num % 2 === 0) ? "上り" : "下り";
}

function generate() {
  let formation = [];
  let total = 0;
  let remaining = 6;

  while (total < 6) {
    if (total >= 2 && Math.random() < 0.25) break;

    let attempts = 0;
    let selected = null;
    while (attempts < 30) {
      const u = units[Math.floor(Math.random() * units.length)];
      if (u.cars <= remaining) {
        selected = u;
        break;
      }
      attempts++;
    }
    if (!selected) break;

    formation.push(
      selected.name === "4321f"
        ? `4321f${selected.cars}両`
        : `${selected.name}形${selected.cars}両`
    );
    total += selected.cars;
    remaining -= selected.cars;
  }

  const weather = weathers[Math.floor(Math.random() * weathers.length)];
  const train = trains[Math.floor(Math.random() * trains.length)];
  const dir = getDirection(train);

  document.getElementById("result").innerHTML = `
    <div>列番:${train}(${dir})</div>
    <div>編成:${formation.join("+")}</div>
    <div>天候:${weather}</div>
  `;
}

// 初回表示
