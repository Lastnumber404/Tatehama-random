function getDirection(trainNo) {
  // 回、アルファベット、_以降を除去して数字だけにする
  let numStr = trainNo
    .replace(/^回/, "")
    .replace(/_[^_]*$/, "")
    .replace(/[A-Z]+$/i, "");
  let num = parseInt(numStr, 10);
  if (isNaN(num)) return "下り";
  return (num % 2 === 0) ? "上り" : "下り";
}

function generate() {
  // 先に列車を選択（フィルタ適用）
  const filterIrekae = document.getElementById("filterIrekae").checked;
  const filterTaihi = document.getElementById("filterTaihi").checked;
  const filterOneman = document.getElementById("filterOneman").checked;
  const filterNext = document.getElementById("filterNext").checked;
  const filterTypeChange = document.getElementById("filterTypeChange").checked;
  const filterHamazono = document.getElementById("filterHamazono").checked;
  const enabledTypes = Array.from(document.querySelectorAll(".type-filter:checked")).map(el => el.value);

  const anyFilter = filterIrekae || filterTaihi || filterOneman || filterNext || filterTypeChange || filterHamazono || enabledTypes.length < 9;

  let candidates = trains.filter(t => {
    const d = trainDetails[t];
    // フィルタが有効なのに詳細がない列車は除外
    if (!d) return !anyFilter;

    if (filterIrekae && d.irekae !== "有") return false;
    if (filterTaihi && d.taihi !== "有") return false;
    if (filterOneman && d.oneman !== "有") return false;
    if (filterNext && !(d.note && d.note.includes("折返"))) return false;
    if (filterTypeChange && d.typechange !== "有") return false;
    if (filterHamazono && d.hamazono !== "有") return false;
    if (enabledTypes.length > 0 && !enabledTypes.includes(d.type)) return false;
    return true;
  });

  if (candidates.length === 0) candidates = trains;
  const train = candidates[Math.floor(Math.random() * candidates.length)];

  // 777は最大4両
  const maxCars = (train === "777") ? 4 : 6;

  let formation = [];
  let total = 0;
  let remaining = maxCars;

  while (total < maxCars) {
    if (total >= 2 && Math.random() < 0.25) break;

    let attempts = 0;
    let selected = null;
    while (attempts < 30) {
      const u = units[Math.floor(Math.random() * units.length)];
      if (u.cars <= remaining) {
        selected = u;
        break;
      }
      attempts++;
    }
    if (!selected) break;

    formation.push(
      selected.name === "4321f"
        ? `4321f${selected.cars}両`
        : `${selected.name}形${selected.cars}両`
    );
    total += selected.cars;
    remaining -= selected.cars;
  }

  const weather = weathers[Math.floor(Math.random() * weathers.length)];
  // train is already selected above
  const dir = getDirection(train);

  const allowDriver = document.getElementById("filterDutyDriver").checked;
  const allowConductor = document.getElementById("filterDutyConductor").checked;
  let dutyOptions = [];
  if (allowDriver) dutyOptions.push("運転");
  if (allowConductor) dutyOptions.push("車掌");
  if (dutyOptions.length === 0) dutyOptions = ["運転", "車掌"];
  const duty = dutyOptions[Math.floor(Math.random() * dutyOptions.length)];

  let detailHtml = "";
  const detail = trainDetails[train];
  if (detail) {
    detailHtml = `
      <div>${detail.type} ${detail.start}→${detail.dest}</div>
      <div>運転時間:${detail.time}</div>
    `;
    if (detail.note) {
      let noteText = detail.note;
      if (noteText.includes("折返:")) {
        noteText = noteText.replace(/。折返:/g, "。<br>折返:").replace(/折返:/g, "<br>折返:");
        noteText = noteText.replace(/^<br>/, "");
        noteText += "（実装済み）";
      }
      detailHtml += `<div>備考:${noteText}</div>`;
    }
    detailHtml += `<div>入換:${detail.irekae} / 退避:${detail.taihi}</div>`;
  }

  document.getElementById("result").innerHTML = `
    <div>列番:${train}(${dir})</div>
    ${detailHtml}
    <div>編成:${formation.join("+")}</div>
    <div>天候:${weather}</div>
    <div>乗務内容:${duty}</div>
  `;
}

// 初回表示
generate();
